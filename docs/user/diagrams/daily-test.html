<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="diagram.css">
<style>
  .row { display: flex; gap: 24px; }
  .row .box { flex: 1; text-align: center; }
  .arrow { text-align: center; font-size: 60px; line-height: 1.2; }
  .target { border-width: 5px; font-weight: 700; font-size: 40px; text-align: center; }
  .note { margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<div id="diagram">
  <div class="row">
    <div class="box"><b class="label">Next</b><br>#next</div>
    <div class="box">due today, tomorrow or overdue</div>
    <div class="box"><b class="label">Waiting for</b><br>no date, or due</div>
  </div>
  <div class="arrow">↓</div>
  <div class="box target">Daily</div>
  <div class="note muted">Someday and Maybe never show on Daily.</div>
</div>
</body>
</html>
