<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Archivo; font-weight: 500; src: url(../../dev/inkhub-poster/fonts/archivo-latin-500-normal.woff2); }
  @font-face { font-family: Archivo; font-weight: 700; src: url(../../dev/inkhub-poster/fonts/archivo-latin-700-normal.woff2); }
  body { margin: 0; background: #fff; }
  #diagram { width: 960px; padding: 40px; box-sizing: border-box; font: 500 30px/1.3 Archivo, sans-serif; color: #000; filter: grayscale(1); }
  .row { display: flex; gap: 24px; }
  .box { flex: 1; border: 3px solid #000; border-radius: 12px; padding: 20px; text-align: center; }
  .arrow { text-align: center; font-size: 60px; line-height: 1.2; }
  .target { border-width: 5px; font-weight: 700; font-size: 40px; }
  .note { margin-top: 24px; color: #444; font-size: 26px; text-align: center; }
  .label { font-weight: 700; }
</style>
</head>
<body>
<div id="diagram">
  <div class="row">
    <div class="box"><b class="label">Next</b><br>#next</div>
    <div class="box">due today, tomorrow or overdue</div>
    <div class="box"><b class="label">Waiting for</b><br>no date, or due</div>
  </div>
  <div class="arrow">↓</div>
  <div class="box target">Daily</div>
  <div class="note">Someday and Maybe never show on Daily.</div>
</div>
</body>
</html>
