# Runs every check and every test, with coverage, on every push to a branch and on pull requests
# (DEVELOPMENT-POLICY §7, docs/dev/history/technical-design-test-tiers.md §3.3). Tags start no run: a release tag
# points at the release commit, which ran here when it was pushed to main.
# Job "build": after the checks, every branch push also builds the plugin and keeps the .snplg as an
# artifact for 30 days (docs/dev/RELEASING.md §4, docs/dev/history/technical-design-ci-builds.md §2.1).
name: check

on:
  push:
    # Branches only: with a branch filter and no tag filter, a pushed tag starts no run. (A tag filter
    # alone, like tags-ignore, would switch off branch pushes too.)
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run coverage
      - name: Coverage by feature area in the job summary
        if: always()
        run: |
          if [ -f coverage/areas.md ]; then cat coverage/areas.md >> "$GITHUB_STEP_SUMMARY"; else echo "No coverage/areas.md - the checks stopped before the coverage report." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: check
    if: github.event_name == 'push'
    # buildPlugin.ps1 is PowerShell and calls gradlew.bat; the Windows image has the Android SDK.
    runs-on: windows-latest
    timeout-minutes: 45
    # A newer push to the same branch cancels a build that is still running.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The build label needs the commit and the tags.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - name: Build the plugin
        shell: powershell
        run: ./buildPlugin.ps1
      - name: Check the build
        id: verify
        run: node scripts/ci-build.mjs verify
      - name: Stop the Gradle daemon
        # Lets the Gradle cache be saved: a running daemon locks files, and tar then fails on Windows.
        if: always()
        shell: powershell
        run: if (Test-Path android\gradlew.bat) { & android\gradlew.bat -p android --stop }
      - uses: actions/upload-artifact@v7
        with:
          name: kept-gtd-${{ steps.verify.outputs.label }}
          path: ${{ steps.verify.outputs.snplg }}
          retention-days: 30
          if-no-files-found: error
