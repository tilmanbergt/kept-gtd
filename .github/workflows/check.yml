# Runs every check and every test, with coverage, on every push to a branch and on pull requests
# (DEVELOPMENT-POLICY §7, docs/dev/history/technical-design-test-tiers.md §3.3). Tags start no run: a release tag
# points at the release commit, which ran here when it was pushed to main.
name: check

on:
  push:
    # Branches only: with a branch filter and no tag filter, a pushed tag starts no run. (A tag filter
    # alone, like tags-ignore, would switch off branch pushes too.)
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run coverage
      - name: Coverage by feature area in the job summary
        if: always()
        run: |
          if [ -f coverage/areas.md ]; then cat coverage/areas.md >> "$GITHUB_STEP_SUMMARY"; else echo "No coverage/areas.md - the checks stopped before the coverage report." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
