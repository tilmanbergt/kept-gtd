# Sets the release being worked on (package.json "nextVersion") from GitHub:
# Actions -> next version -> Run workflow, enter e.g. 0.23.0 (docs/dev/GITHUB-GUIDE.md,
# docs/dev/history/technical-design-github-workflow.md §2.2). Test builds are then labelled 0.23.0-alpha+...,
# and the beta workflow makes betas of 0.23.0.
# Pushes to main with the deploy key RELEASE_DEPLOY_KEY (the workflow token may not write to a protected main).
name: next version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release to work on next, x.y.z (e.g. 0.23.0) - must be above the current version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: write-main
  cancel-in-progress: false

jobs:
  next-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this on branch main - this run is on ${{ github.ref_name }}."
          exit 1
      - name: Deploy key present
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret RELEASE_DEPLOY_KEY is missing - see docs/dev/GITHUB-GUIDE.md, 'One-time setup'."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set nextVersion
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/gen-bundled-content.mjs --set-next "$(echo "$VERSION" | tr -d '[:space:]v')"
      - name: Commit and push to main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$(echo "$VERSION" | tr -d '[:space:]v')"
          if git diff --quiet package.json; then
            echo "::error::nextVersion already is $v - nothing to change."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Set next version $v" -m "Set by the workflow \"next version\"." -m "Device test: none - version only." package.json
          git push origin HEAD:main
          {
            echo "**nextVersion is now $v.**"
            echo ""
            echo "Next: test builds from main are labelled $v-alpha+<commit>; when the release is complete, Actions -> beta, or release."
          } >> "$GITHUB_STEP_SUMMARY"
